services:
  migrate:
    build: .
    command: alembic upgrade head
    env_file: .env
    volumes:
      - ./:/app
    restart: "no"

  bot:
    build: .
    command: python -m app.main_bot
    env_file: .env
    volumes:
      - ./:/app
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  api:
    build: .
    command: python -m app.main_api
    env_file: .env
    volumes:
      - ./:/app
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "0.0.0.0:${WEBHOOK_PORT:-8080}:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
