services:
  xray:
    image: teddysun/xray:latest
    restart: unless-stopped
    volumes:
      - ./xray-config.json:/etc/xray/config.json
    ports:
      - "127.0.0.1:10808:10808"
      - "127.0.0.1:10809:10809"

  migrate:
    build: .
    command: alembic upgrade head
    env_file: .env
    volumes:
      - ./:/app
    restart: "no"

  bot:
    build: .
    command: python -m app.main_bot
    env_file: .env
    volumes:
      - ./:/app
    depends_on:
      migrate:
        condition: service_completed_successfully
      xray:
        condition: service_started
    restart: unless-stopped

  api:
    build: .
    command: python -m app.main_api
    env_file: .env
    volumes:
      - ./:/app
    depends_on:
      migrate:
        condition: service_completed_successfully
      xray:
        condition: service_started
    ports:
      - "0.0.0.0:${WEBHOOK_PORT:-8080}:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
